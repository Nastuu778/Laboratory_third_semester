name: 'C++ CI'

on:
  push:
    branches:
      - lab1

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake .
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v0.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

      - name: Upload Linux Release Asset
        id: upload-linux-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ steps.get_version.outputs.commit_count }}-Linux.deb
          asset_name: helloworld-0.0.${{ steps.get_version.outputs.commit_count }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Save release info for Windows job
        run: |
          echo "UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${{ steps.get_version.outputs.commit_count }}" >> $GITHUB_ENV

  build-windows:
    runs-on: windows-latest
    needs: build-linux  # Важно: зависит от Linux job
    permissions:
      contents: write
    env:
      UPLOAD_URL: ${{ needs.build-linux.outputs.upload_url }}
      RELEASE_VERSION: ${{ needs.build-linux.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          choco install cmake -y
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install boost-test:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -C Release --verbose

      - name: List build artifacts
        run: dir build -Recurse

      - name: Create Windows distribution package
        run: |
          # Создаем ZIP архив с Windows версией
          Compress-Archive -Path "build/Release/helloworld_cli.exe" -DestinationPath "helloworld-windows-v0.0.$env:RELEASE_VERSION.zip"

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: ./helloworld-windows-v0.0.${{ env.RELEASE_VERSION }}.zip
          asset_name: helloworld-windows-v0.0.${{ env.RELEASE_VERSION }}.zip
          asset_content_type: application/zip