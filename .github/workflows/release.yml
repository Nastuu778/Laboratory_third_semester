name: 'C++ CI'

on:
  push:
    branches:
      - lab1

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake .
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v0.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ steps.get_version.outputs.commit_count }}-Linux.deb
          asset_name: helloworld-0.0.${{ steps.get_version.outputs.commit_count }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          choco install cmake -y
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install boost-test:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -C Release --verbose

      - name: Get commit count (for Windows)
        id: get_win_version
        run: |
          $commitCount = git rev-list --count HEAD
          echo "commit_count=$commitCount" >> $env:GITHUB_OUTPUT

      - name: List build artifacts
        run: dir build -Recurse

      - name: Create Windows distribution package
        run: |
          # Создаем ZIP архив с Windows версией
          Compress-Archive -Path "build/Release/helloworld_cli.exe" -DestinationPath "helloworld-windows-v0.0.${{ needs.build-linux.outputs.release_version }}.zip"

      - name: Upload Windows Release Asset using API
        run: |
          $version = "${{ needs.build-linux.outputs.release_version }}"
          $repo = "${{ github.repository }}"
          $zipFile = "helloworld-windows-v0.0.$version.zip"
          $assetName = "helloworld-windows-v0.0.$version.zip"
          
          $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/v0.0.$version"
          $headers = @{
            Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
            Accept = "application/vnd.github.v3+json"
          }
          
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}', ''
          
          $uploadHeaders = @{
            Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
            "Content-Type" = "application/zip"
          }
          
          Invoke-RestMethod -Uri "$uploadUrl?name=$assetName" -Method Post -InFile $zipFile -Headers $uploadHeaders