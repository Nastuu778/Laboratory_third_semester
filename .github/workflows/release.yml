name: CI/CD Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake dpkg-dev debhelper

    - name: Configure and Build
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: Run tests
      run: |
        cd build
        ./containers_demo

    - name: Create DEB package structure
      run: |
        mkdir -p packages/containers-demo_1.0.0_amd64/usr/local/bin
        mkdir -p packages/containers-demo_1.0.0_amd64/usr/share/doc/containers-demo
        mkdir -p packages/containers-demo_1.0.0_amd64/DEBIAN
        
        # Copy binary
        cp build/containers_demo packages/containers-demo_1.0.0_amd64/usr/local/bin/
        chmod +x packages/containers-demo_1.0.0_amd64/usr/local/bin/containers_demo
        
        # Create control file
        cat > packages/containers-demo_1.0.0_amd64/DEBIAN/control << EOF
        Package: containers-demo
        Version: 1.0.0
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Your Name <your.email@example.com>
        Description: Demonstration of custom containers (Vector, LinkedList)
         This package contains a demonstration program showing
         the implementation of custom containers in C++.
        EOF
        
        # Create copyright file
        cat > packages/containers-demo_1.0.0_amd64/usr/share/doc/containers-demo/copyright << EOF
        Copyright 2024 Your Name
        License: MIT
        EOF
        
        # Create changelog
        cat > packages/containers-demo_1.0.0_amd64/usr/share/doc/containers-demo/changelog.Debian << EOF
        containers-demo (1.0.0) stable; urgency=medium
        
          * Initial release
          * Contains Vector, DoublyLinkedList, and SinglyLinkedList implementations
        
         -- Your Name <your.email@example.com>  $(date -R)
        EOF
        gzip -9n packages/containers-demo_1.0.0_amd64/usr/share/doc/containers-demo/changelog.Debian

    - name: Build DEB package
      run: |
        dpkg-deb --build packages/containers-demo_1.0.0_amd64
        mv packages/containers-demo_1.0.0_amd64.deb containers-demo_1.0.0_amd64.deb

    - name: Upload DEB package artifact
      uses: actions/upload-artifact@v4
      with:
        name: containers-demo-linux
        path: containers-demo_1.0.0_amd64.deb

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Run tests
      run: |
        .\build\Release\containers_demo.exe

    - name: Create Windows distribution
      run: |
        mkdir dist_windows
        copy build\Release\containers_demo.exe dist_windows\
        # Create a simple batch file to run the program
        echo @echo off > dist_windows\run_containers_demo.bat
        echo containers_demo.exe >> dist_windows\run_containers_demo.bat
        echo pause >> dist_windows\run_containers_demo.bat

    - name: Create ZIP package
      run: |
        Compress-Archive -Path dist_windows\* -DestinationPath containers-demo-windows.zip

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: containers-demo-windows
        path: |
          containers-demo-windows.zip
          build/Release/containers_demo.exe

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: containers-demo-linux

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: containers-demo-windows

    - name: Display structure of downloaded files
      run: ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          containers-demo_1.0.0_amd64.deb
          containers-demo-windows.zip
          containers_demo.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}