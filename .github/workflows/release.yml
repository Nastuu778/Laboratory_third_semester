name: 'C++ CI'

on:
  push:
    branches:
      - lab3

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from CMake
        id: get_version
        run: |
          VERSION=$(grep "project(ContainersDemo VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.release_version }}
          release_name: Release v${{ steps.get_version.outputs.release_version }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make

      - name: Run tests
        run: |
          cd build
          ./containers_demo

      - name: Create DEB package with CPack
        run: |
          cd build
          cpack -G DEB

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/ContainersDemo-${{ needs.create-release.outputs.release_version }}-Linux.deb
          asset_name: containers-demo-linux-v${{ needs.create-release.outputs.release_version }}.deb
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake -y
          choco install ninja -y

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run tests
        run: |
          cd build
          .\containers_demo.exe

      - name: Create Windows package with CPack
        run: |
          cd build
          cpack -G ZIP

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/ContainersDemo-${{ needs.create-release.outputs.release_version }}-win64.zip
          asset_name: containers-demo-windows-v${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip

      - name: Upload Windows EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/containers_demo.exe
          asset_name: containers_demo-v${{ needs.create-release.outputs.release_version }}.exe
          asset_content_type: application/vnd.microsoft.portable-executable