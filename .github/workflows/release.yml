name: 'C++ CI'

on:
  push:
    branches:
      - lab7

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v7.0.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v7.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Boost dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-filesystem-dev libboost-program-options-dev libboost-system-dev

      - name: Configure CMake
        run: cmake -B build

      - name: Build and package
        run: |
          cmake --build build
          cd build
          cpack -G DEB

      # 🔍 НАДЁЖНОЕ ОПРЕДЕЛЕНИЕ ИМЕНИ ФАЙЛА .deb
      - name: Find .deb file
        id: find_deb
        run: |
          DEB_FILE=$(find build -name "*.deb" | head -n1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found!"
            exit 1
          fi
          echo "deb_path=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename "$DEB_FILE")" >> $GITHUB_OUTPUT

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_deb.outputs.deb_path }}
          asset_name: ${{ steps.find_deb.outputs.deb_name }}
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up CMake (via choco)
        run: |
          choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Set up vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install boost-filesystem boost-program-options boost-system:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "build\Release\duplicate_finder.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Executable not found: $exe"
            exit 1
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.release_version }}"
          $zipName = "duplicate_finder-windows-v7.0.$version.zip"
          Compress-Archive -Path "build\Release\duplicate_finder.exe" -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.Create\ Windows\ ZIP.outputs.zip_name }}
          asset_name: ${{ steps.Create\ Windows\ ZIP.outputs.zip_name }}
          asset_content_type: application/zip