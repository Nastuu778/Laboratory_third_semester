name: 'Physics Simulator CI'

on:
  push:
    branches:
      - lab5

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ steps.get_version.outputs.commit_count }}
          name: Release v0.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev cmake

      # зависимости для SFML (X11 + OpenGL)
      - name: Install X11 and OpenGL dependencies for SFML
        run: |
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libudev-dev

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --verbose

      - name: Run tests (if any)
        run: |
          cd build
          ./physics ../data/smile.txt &  # запустить в фоне, если интерактивный
          sleep 2
          kill %1 || true   # завершить, если не завершился сам

      - name: Package (create .deb)
        run: |
          cd build
          cpack -G DEB

      - name: Find and upload .deb
        run: |
          ls -l build/
          DEB_FILE=$(find build -name "*.deb" | head -n1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found!"
            exit 1
          fi
          echo "Found DEB: $DEB_FILE"
          cp "$DEB_FILE" physics-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./physics-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb
          asset_name: physics-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install CMake and vcpkg
        run: |
          choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg
        run: |
          cd vcpkg
          .\vcpkg install boost-test:x64-windows

      - name: Configure CMake with vcpkg toolchain
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" -A x64

      - name: Build project
        run: cmake --build build --config Release --verbose

      - name: Run test
        shell: pwsh
        run: |
          Start-Process -FilePath "build\Release\physics.exe" -ArgumentList "..\data\smile.txt" -PassThru | Wait-Process -Timeout 30

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.release_version }}"
          Compress-Archive -Path "build\Release\physics.exe" -DestinationPath "physics-windows-v0.0.$version.zip"

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./physics-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_name: physics-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip