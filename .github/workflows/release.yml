name: 'C++ CI'

on:
  push:
    branches:
      - lab1

jobs:
  # Существующая рабочая сборка для Linux (не меняем)
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_name: helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  # Новая сборка для Windows (только артефакты, без релиза)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      
      # Установка зависимостей для Windows
      - name: Install dependencies
        run: |
          choco install boost -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      
      # Настройка и сборка
      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build project
        run: cmake --build .
      
      - name: Run tests
        run: cmake --build . --target test
      
      # Создание пакета (если настроено в CMakeLists.txt)
      - name: Create package
        run: |
          cmake --build . --target package || echo "Package target not available"
          # Альтернативно: cpack -G ZIP
      
      # Загрузка исполняемых файлов как артефактов
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_number }}
          path: |
            *.exe
            *.dll
            *.zip
            *.msi
            *.nsis
          if-no-files-found: warn
          retention-days: 7