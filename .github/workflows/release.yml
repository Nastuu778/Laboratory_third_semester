name: 'C++ CI'

on:
  push:
    branches:
      - lab2

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from CMake
        id: get_version
        run: |
          VERSION=$(grep "project(ip_filter VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.release_version }}
          release_name: Release v${{ steps.get_version.outputs.release_version }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make
          cpack

      - name: Run tests
        run: |
          cd build
          ./gtest_tests/ip_filter_tests

      - name: Test main application
        run: |
          cd build
          echo -e "1.1.1.1\t111\t0\n2.2.2.2\t222\t0" | ./ip_filter

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/ip_filter-${{ needs.create-release.outputs.release_version }}-linux.tar.gz
          asset_name: ip_filter-linux-v${{ needs.create-release.outputs.release_version }}.tar.gz
          asset_content_type: application/gzip

  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake -y
          choco install ninja -y

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" ..
          cmake --build .
          cpack

      - name: Run tests
        run: |
          cd build
          .\gtest_tests\ip_filter_tests.exe

      - name: Test main application
        run: |
          cd build
          echo "1.1.1.1	111	0" > test_input.txt
          echo "2.2.2.2	222	0" >> test_input.txt
          Get-Content test_input.txt | .\ip_filter.exe

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/ip_filter-${{ needs.create-release.outputs.release_version }}-windows.zip
          asset_name: ip_filter-windows-v${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip