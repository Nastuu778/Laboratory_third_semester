name: 'C++ CI'

on:
  push:
    branches:
      - lab6

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v0.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install CMake and GCC
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create Linux Archive
        run: |
          cd build
          tar -czf vector-editor-linux.tar.gz vector-editor

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/vector-editor-linux.tar.gz
          asset_name: vector-editor-linux-v0.0.${{ needs.create-release.outputs.release_version }}.tar.gz
          asset_content_type: application/gzip

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create Windows ZIP
        run: |
          Compress-Archive -Path "build\Release\vector-editor.exe" -DestinationPath "vector-editor-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip"

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./vector-editor-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_name: vector-editor-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip