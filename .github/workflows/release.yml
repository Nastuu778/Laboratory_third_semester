name: 'C++ CI'

on:
  push:
    branches:
      - lab1

jobs:
  # Существующая рабочая сборка для Linux (не меняем)
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_name: helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  # Исправленная сборка для Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      
      # Установка зависимостей для Windows с указанием архитектуры
      - name: Install dependencies
        run: |
          choco install boost-msvc-14.3 -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      
      # Настройка переменных окружения для Boost
      - name: Set Boost environment variables
        run: |
          $boostPath = "C:\local\boost_1_85_0"
          if (Test-Path $boostPath) {
            echo "BOOST_ROOT=$boostPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "BOOST_LIBRARYDIR=$boostPath\lib64-msvc-14.3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "BOOST_INCLUDEDIR=$boostPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      
      # Альтернативный вариант: использование vcpkg (более надежный)
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install boost-test:x64-windows
        shell: pwsh
      
      # Настройка CMake с указанием пути к Boost
      - name: Configure CMake
        run: |
          cmake . `
            -DPATCH_VERSION=${{ github.run_number }} `
            -DBOOST_ROOT="C:/local/boost_1_85_0" `
            -DBOOST_LIBRARYDIR="C:/local/boost_1_85_0/lib64-msvc-14.3" `
            -DBOOST_INCLUDEDIR="C:/local/boost_1_85_0" `
            -DBOOST_NO_SYSTEM_PATHS=ON `
            -A x64
        shell: pwsh
      
      # Или с использованием vcpkg
      - name: Configure CMake with vcpkg
        run: |
          cmake . `
            -DPATCH_VERSION=${{ github.run_number }} `
            -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -A x64
        shell: pwsh
      
      - name: Build project
        run: cmake --build . --config Release
        shell: pwsh
      
      - name: Run tests
        run: ctest -C Release --verbose
        shell: pwsh
      
      # Загрузка исполняемых файлов как артефактов
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_number }}
          path: |
            **/*.exe
            **/*.dll
            **/Release/
            **/*.pdb
          if-no-files-found: warn
          retention-days: 7
        shell: pwsh