name: 'C++ CI - Containers Project'

on:
  push:
    branches:
      - lab3

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ steps.get_version.outputs.commit_count }}
          release_name: Release v0.0.${{ steps.get_version.outputs.commit_count }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ./containers_demo

      - name: Create DEB package structure
        run: |
          mkdir -p packages/containers-demo/usr/local/bin
          mkdir -p packages/containers-demo/DEBIAN
          cp build/containers_demo packages/containers-demo/usr/local/bin/
          
          # Create control file for DEB package
          cat > packages/containers-demo/DEBIAN/control << EOF
          Package: containers-demo
          Version: 0.0.${{ needs.create-release.outputs.release_version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <your.email@example.com>
          Description: Custom containers demonstration project
            Demonstration of Vector, DoublyLinkedList and SinglyLinkedList implementations
          EOF

      - name: Build DEB package
        run: dpkg-deb --build packages/containers-demo

      - name: Rename DEB package
        run: mv packages/containers-demo.deb containers-demo-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./containers-demo-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb
          asset_name: containers-demo-0.0.${{ needs.create-release.outputs.release_version }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build/Release
          .\containers_demo.exe

      - name: Create Windows distribution package
        run: |
          Compress-Archive -Path "build/Release/containers_demo.exe" -DestinationPath "containers-demo-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip"

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./containers-demo-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_name: containers-demo-windows-v0.0.${{ needs.create-release.outputs.release_version }}.zip
          asset_content_type: application/zip

  test-results:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Test Results Summary
        run: |
          echo "All builds completed successfully!"
          echo "Linux: DEB package created"
          echo "Windows: EXE package created"
          echo "Release: v0.0.${{ needs.create-release.outputs.release_version }}"