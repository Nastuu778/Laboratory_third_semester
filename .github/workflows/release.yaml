name: CI/CD Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libgtest-dev
        
    - name: Build GTest
      run: |
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp lib/*.a /usr/lib
        
    - name: Configure project
      run: |
        mkdir build
        cd build
        cmake ..
        
    - name: Build project
      run: |
        cd build
        make
        
    - name: Run tests
      run: |
        cd build
        ./ip_filter_test
        
    - name: Test main application
      run: |
        cd build
        echo -e "1.1.1.1\t111\t0\n2.2.2.2\t222\t0" | ./ip_filter

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Windows)
      run: |
        choco install cmake -y
        choco install mingw -y
        
    - name: Configure project
      run: |
        mkdir build
        cd build
        cmake -G "MinGW Makefiles" ..
        
    - name: Build project
      run: |
        cd build
        cmake --build .
        
    - name: Run tests
      run: |
        cd build
        .\ip_filter_test.exe
        
    - name: Test main application
      run: |
        cd build
        echo "1.1.1.1	111	0\n2.2.2.2	222	0" | .\ip_filter.exe