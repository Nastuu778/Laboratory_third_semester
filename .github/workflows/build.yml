name: C++ CI with Asset Upload

on:
  push:
    branches: [ lab6 ]

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count
        id: get_version
        run: |
          COUNT=$(git rev-list --count HEAD)
          TAG="v0.0.$COUNT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create tar.gz for Linux
        run: |
          cd build
          tar -czf vector-editor-linux.tar.gz vector-editor

      - name: Upload Linux asset to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: build/vector-editor-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create ZIP for Windows
        run: |
          Compress-Archive -Path "build\Release\vector-editor.exe" -DestinationPath "vector-editor-windows.zip"

      - name: Upload Windows asset to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: vector-editor-windows.zip